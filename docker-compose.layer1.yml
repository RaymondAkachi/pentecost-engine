version: '3.8'

services:
  # --- CORE ---
  nats:
    image: nats:alpine
    command: "-js -m 8222"
    ports: ["4222:4222", "8222:8222"]

  # --- INFRASTRUCTURE INITIALIZER (Runs Once) ---
  init-infra:
    image: python:3.10-slim
    command: >
      sh -c "pip install nats-py && python -u init_infra.py"
    volumes:
      - ./init_infra.py:/app/init_infra.py
    environment:
      - NATS_URL=nats://nats:4222
    depends_on: [nats]

  # --- INPUT ---
  ingestion:
    build: ./services/ingestion
    environment:
      - NATS_URL=nats://nats:4222
      - INPUT_URL=https://www.youtube.com/watch?v=ijcfMijOgao # Not permanent live church broadcast, just for testing
    depends_on: [init-infra]

  # --- LAYER 1: ASR ---
  asr:
    build: ./services/asr
    environment:
      - NATS_URL=nats://nats:4222
      - INPUT_SUBJECT=livestream.audio.raw # Bypass Denoiser for CPU Speed
      - MODEL_SIZE=tiny                    # CPU Friendly
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
    volumes:
      - ./services/asr:/app
      - /app/models
    depends_on: [ingestion]

  # --- LAYER 1.5: RAG ---
  rag:
    build: ./services/theology
    environment:
      - RAG_NATS_URL=nats://nats:4222
      - RAG_INPUT_SUBJECT=livestream.transcription.raw
      - RAG_OUTPUT_SUBJECT=livestream.transcription.enriched
    depends_on: [asr]

  # --- LAYER 1.5: TRANSLATION ---
  translation:
    image: pentecost-engine-translation:latest
    build: ./services/translation
    volumes:
      - ./services/translation/src:/app/src
    command: python -u -m src.main
    environment:
      - TRANS_NATS_URL=nats://nats:4222
      - TRANS_INPUT_SUBJECT=livestream.transcription.enriched
      - TRANS_OUTPUT_SUBJECT_PREFIX=livestream.translation
    depends_on: [rag]

  # --- VISUALIZATION ---
  pipeline-viewer:
    image: python:3.10-slim
    command: >
      sh -c "pip install nats-py && python -u pipeline_viewer.py"
    volumes:
      - ./pipeline_viewer.py:/app/pipeline_viewer.py
    environment:
      - NATS_URL=nats://nats:4222
    depends_on: [translation]