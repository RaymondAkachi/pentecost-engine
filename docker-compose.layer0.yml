version: '3.8'

services:
  # 1. Message Broker (NATS JetStream)
  nats:
    image: nats:alpine
    container_name: pentecost-nats
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5

  # 2. Ingestion Service (Go - Layer 0)
  # Updated to run the ACTUAL production binary, not a test signal.
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: pentecost-ingestion
    environment:
      - NATS_URL=nats://nats:4222
      # Default: Lofi Girl (Safe 24/7 stream). Change to Apostle's URL for live test.
      - INPUT_URL=https://www.youtube.com/watch?v=jfKfPfyJRdk
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. Denoiser Service (Python/DTLN - Layer 0.5)
  # Subscribes to 'livestream.audio.raw', Publishes 'livestream.audio.denoised'
  denoiser:
    build:
      context: ./services/denoiser
      dockerfile: Dockerfile
    container_name: pentecost-denoiser
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0' # DTLN is lightweight
          memory: 512M

  # 4. Pipeline Validator (Quality Control)
  # Listens to the FINAL output to ensure the whole chain is working.
  validator:
    image: python:3.10-slim
    container_name: pentecost-validator
    command: >
      sh -c "
      pip install nats-py numpy &&
      cat <<EOF > validator.py
      import asyncio, nats, sys
      async def main():
          print('🔎 Connecting to NATS...')
          try:
              nc = await nats.connect('nats://nats:4222')
          except:
              print('❌ NATS Connection Failed')
              sys.exit(1)
          
          js = nc.jetstream()
          print('✅ Validator Connected. Listening for DENOISED audio...')
          
          count = 0
          async def cb(msg):
              nonlocal count
              count += 1
              pts = msg.header.get('pts', 'N/A')
              print(f'✨ [VALIDATOR] Received Denoised Frame #{count} | PTS: {pts} | Size: {len(msg.data)} bytes')
          
          # Subscribe to the OUTPUT of the Denoiser
          await js.subscribe('livestream.audio.denoised', cb=cb)
          
          # Keep alive for observation
          while True: await asyncio.sleep(1)

      if __name__ == '__main__':
          asyncio.run(main())
      EOF
      python -u validator.py
      "
    depends_on:
      denoiser:
        condition: service_started