  # 5. Pipeline Validator
  validator:
    build: 
      context: ./services/validator
      dockerfile: Dockerfile
    container_name: pentecost-validator
    environment:
      - NATS_URL=nats://nats:4222
    # Mount script for easy editing, but deps are now baked in
    volumes:
      - ./validator.py:/app/validator.py
    depends_on:
