version: '3.8'

services:
  # 1. Message Broker
  nats:
    image: nats:alpine
    container_name: pentecost-nats
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5

  # 2. Ingestion Service
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: pentecost-ingestion
    environment:
      - NATS_URL=nats://nats:4222
      - INPUT_URL=https://www.youtube.com/watch?v=jfKfPfyJRdk
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. Denoiser Service
  denoiser:
    build:
      context: ./services/denoiser
      dockerfile: Dockerfile
    container_name: pentecost-denoiser
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 4. Pipeline Validator (Quality Control)
  validator:
    image: python:3.10-slim
    container_name: pentecost-validator
    working_dir: /app
    # Fix: Ensure dependencies are installed before running
    command: >
      sh -c "pip install nats-py numpy && python -u validator.py"
    volumes:
      # Mount the local validator.py into the container
      - ./validator.py:/app/validator.py
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      denoiser:
        condition: service_started