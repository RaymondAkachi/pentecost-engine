version: '3.8'

services:
  # 1. Message Broker
  nats:
    image: nats:alpine
    container_name: pentecost-nats
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5

  # 2. Ingestion Service
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: pentecost-ingestion
    environment:
      - NATS_URL=nats://nats:4222
      # TEST URL: Sky News Live (24/7 Continuous Speech for ASR Testing)
      - INPUT_URL=https://www.youtube.com/watch?v=iEpJwprxDdk
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

