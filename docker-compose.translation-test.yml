version: '3.8'

services:
  # 1. Message Broker (Ephemeral - No persistence)
  nats:
    image: nats:alpine
    # -js: Enable JetStream
    # -m 8222: Monitor port
    # --store_dir /tmp/nats: Forces ephemeral storage (wiped on restart)
    command: "-js -m 8222 --store_dir /tmp/nats"
    ports: ["4222:4222", "8222:8222"]

  # 2. Translation Service
  translation:
    build:
      context: ./services/translation
      dockerfile: Dockerfile
    environment:
      - TRANS_NATS_URL=nats://nats:4222
      - TRANS_INPUT_SUBJECT=livestream.transcription.enriched
      - TRANS_OUTPUT_SUBJECT_PREFIX=livestream.translation
    depends_on: [nats]

  # 3. Test Driver
  translation-tester:
    image: python:3.10-slim
    volumes:
      - ./tests:/app/tests
    working_dir: /app
    environment:
      - NATS_URL=nats://nats:4222
    command: >
      sh -c "pip install nats-py && python -u tests/test_translation_independent.py"
    depends_on: [translation]