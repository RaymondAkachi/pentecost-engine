version: '3.8'

services:
  nats:
    image: nats:alpine
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      # Now this URL will actually exist
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5

  ingestion-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - NATS_URL=nats://nats:4222
      # Use a 24/7 stream to guarantee data
      - INPUT_URL=https://www.youtube.com/watch?v=jfKfPfyJRdk
    depends_on:
      - nats