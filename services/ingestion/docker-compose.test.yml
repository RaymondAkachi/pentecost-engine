version: '3.8'

services:
  nats:
    image: nats:alpine
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      # Now this URL will actually exist
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile  # Using your original production Dockerfile
    container_name: pentecost-ingestion
    environment:
      - NATS_URL=nats://nats:4222
      - INPUT_URL=https://www.youtube.com/watch?v=YDvsBbKfLPA
    volumes:
      # Removed .:/app to prevent overwriting the compiled binary
      - shared_chunks:/shared/chunks
    depends_on:
      - nats

  validator:
    build:
      context: .
      dockerfile: Dockerfile.validator
    container_name: pentecost-validator
    environment:
      - NATS_URL=nats://nats:4222
    volumes:
      # Removed .:/app to prevent overwriting the Python script
      - shared_chunks:/shared/chunks
    depends_on:
      - nats
      - ingestion

volumes:
  shared_chunks:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1G,uid=1000