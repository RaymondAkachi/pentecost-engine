version: '3.8'

services:
  # NATS JetStream Server (The Backbone)
  nats:
    image: nats:alpine
    container_name: pentecost-nats
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Layer 0: Ingestion Service
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pentecost-ingestion
    restart: always  # Production setting: Auto-restart on crash
    environment:
      - NATS_URL=nats://nats:4222
      # Apostle Orokpo's Channel (or Lofi Girl for dev)
      - INPUT_URL=https://www.youtube.com/watch?v=jfKfPfyJRdk
    depends_on:
      nats:
        condition: service_healthy
    # Deploy limits to match your Architecture Blueprint (ensure resources)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M