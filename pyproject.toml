[project]
name = "pentecost-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nats-py>=2.13.1",
    "numpy==1.26.4",
    "prometheus-client>=0.24.1",
    "protobuf>=6.33.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "soundfile>=0.13.1",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
testpaths = ["tests"]


override-dependencies = [
    "numpy==1.26.4"
]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cpu"] #/cpu if there is no GPU

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.uv.workspace]
members = [
    "services/face_detection",
]
